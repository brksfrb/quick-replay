[workspace]
members = [".", "crates/qr-mp4"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/brksfrb/quick-replay"

[package]
name = "quick-replay"
description = "Lightweight instant replay and screen recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "QuickReplay"
path = "src/main.rs"

[dependencies]
qr-mp4 = { path = "crates/qr-mp4" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# glow instead of wgpu keeps the binary and the GUI's memory use small.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
windows-core = "0.62"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinHttp",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.epaint]
opt-level = 3

[profile.release.package.egui_glow]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
