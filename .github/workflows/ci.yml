name: CI

on:
  push:
    branches: [main, fix/recording-sharpness, test/selftest-encode-v016]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/QuickReplay.exe dist/QuickReplay.exe
          cd dist && sha256sum QuickReplay.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickreplay-windows
          path: |
            dist/QuickReplay.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
