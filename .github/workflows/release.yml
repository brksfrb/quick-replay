name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/QuickReplay.exe dist/QuickReplay.exe
          cd dist && sha256sum QuickReplay.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/QuickReplay.exe dist/SHA256SUMS.txt \
            --title "QuickReplay $GITHUB_REF_NAME" --generate-notes
